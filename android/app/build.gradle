plugins { id 'com.android.application' }
android {
    namespace 'com.harira.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.harira.app'
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName '1.0.' + (System.getenv('VERSION_CODE') ?: '1')
    }
    signingConfigs {
        // مفتاح توقيع ثابت محفوظ بالمستودع حتى كل نسخة جديدة تتثبت فوق القديمة
        release {
            storeFile file('../release.keystore')
            storePassword 'T34W1dly8M2dTA8WS8YxZ2jt'
            keyAlias 'harira'
            keyPassword 'T34W1dly8M2dTA8WS8YxZ2jt'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
