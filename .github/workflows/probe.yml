name: فحص GitHub Models
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
  models: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: فحص
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/r; cd /tmp/r
          U=https://models.github.ai/inference/chat/completions
          curl -s -D - -o /dev/null -X OPTIONS -H "Origin: https://mohamedfayzyasenalsabagh-create.github.io" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: authorization,content-type" $U > cors.txt 2>&1
          curl -sL -o food.jpg "https://upload.wikimedia.org/wikipedia/commons/thumb/6/6d/Good_Food_Display_-_NCI_Visuals_Online.jpg/640px-Good_Food_Display_-_NCI_Visuals_Online.jpg"
          B64=$(base64 -w0 food.jpg)
          for M in openai/gpt-4.1-mini openai/gpt-4o-mini meta/Llama-4-Scout-17B-16E-Instruct; do
            jq -n --arg m "$M" --arg img "data:image/jpeg;base64,$B64" '{model:$m,max_tokens:300,messages:[{role:"user",content:[{type:"text",text:"List the foods in this photo with estimated grams as short JSON."},{type:"image_url",image_url:{url:$img}}]}]}' > body.json
            echo "== $M" >> models.txt
            curl -s -D - -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" -H "Origin: https://mohamedfayzyasenalsabagh-create.github.io" -d @body.json $U | grep -iE "^HTTP|access-control|x-ratelimit|content|\"message\"" | head -20 >> models.txt
          done
          rm -f food.jpg body.json
          git config --global user.name ci; git config --global user.email ci@x
          git init -q -b probe && git add -A && git commit -qm probe && git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" probe
