name: بناء تطبيق أندرويد
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      # ما منحط محلل الصور جوّا التطبيق: الملف الكبير (٣٦ ميغا) كان يخرب بالتنزيل عند بعض الناس ("التطبيق ليس مثبتاً").
      # محلل الصور بينزل مرة وحدة أول ما يستعمله وبينحفظ بالموبايل.
      - name: بناء APK الموقّع
        env:
          VERSION_CODE: "${{ github.run_number }}"
        run: |
          set -o pipefail
          gradle -p android assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          cp android/app/build/outputs/apk/release/app-release.apk harira.apk
          ls -la harira.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          name: تطبيق حريره (نسخة ${{ github.run_number }})
          make_latest: "true"
          files: harira.apk
          body: "نزّل harira.apk وثبّته على الموبايل. التحديثات على المحتوى بتوصل لحالها بدون تنزيل نسخة جديدة."
      - name: حفظ سجل البناء عند الفشل
        if: failure()
        run: |
          git config --global user.name "harira-ci"; git config --global user.email "ci@harira.app"
          mkdir -p /tmp/l && cp build.log /tmp/l/ 2>/dev/null || echo none > /tmp/l/build.log
          cd /tmp/l && git init -q -b ci-logs && git add -A && git commit -qm log
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-logs
