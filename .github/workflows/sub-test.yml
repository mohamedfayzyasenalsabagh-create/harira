name: تجربة الاشتراك
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["web/sub.js", "web/admin.html", "tests/sub_e2e.py", ".github/workflows/sub-test.yml"]
permissions:
  contents: write
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q playwright cryptography && python -m playwright install --with-deps chromium >/dev/null
      - run: |
          mkdir -p .results
          (cd web && python3 -m http.server 8080 >/dev/null 2>&1 &)
          sleep 2; python3 tests/sub_e2e.py || true
      - if: always()
        run: |
          cd .results && git init -q -b ci-sub && git add -A && git -c user.name=ci -c user.email=ci@x commit -qm r && git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-sub
