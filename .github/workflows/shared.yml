# كل ساعة: يجمع اللي تعلّمه التطبيق من كل المستخدمين وينشره للكل
name: التعلّم المشترك
on:
  schedule: [{ cron: "17 * * * *" }]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: shared, cancel-in-progress: false }
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: جمع التصحيحات
        id: c
        run: |
          python3 tools/collect_shared.py | tee out.txt
          if git diff --quiet web/ml/shared.json web/subs.json; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: حفظ
        run: |
          git config user.name "harira-bot"; git config user.email "bot@harira.app"
          git add web/ml/shared.json web/subs.json tools/ntfy_since.txt 2>/dev/null || git add web/ml/shared.json web/subs.json
          git diff --cached --quiet || (git commit -qm "تعلّم مشترك وتفعيلات: $(cat out.txt | tr '\n' ' ')" && git push)
      - name: نشر الموقع
        if: steps.c.outputs.changed == 'true'
        run: |
          sed -i "s/harira-v[0-9a-z]*/harira-${GITHUB_SHA::7}s/" web/sw.js
          echo "${GITHUB_SHA::7}s" > web/version.txt
      - uses: peaceiris/actions-gh-pages@v4
        if: steps.c.outputs.changed == 'true'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          publish_branch: gh-pages
          force_orphan: true
