name: تنزيل موديل الأكل
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/fetch-model.yml"]
permissions:
  contents: write
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p /tmp/m && cd /tmp/m
          try(){ echo "== $1" >> log.txt; curl -sSL -A "Mozilla/5.0" -o "$2" "$1" -w "%{http_code} %{size_download}\n" >> log.txt 2>&1; file "$2" >> log.txt; }
          try "https://storage.googleapis.com/mediapipe-models/image_classifier/efficientnet_lite0/int8/1/efficientnet_lite0.tflite" general.tflite
          try "https://storage.googleapis.com/mediapipe-models/image_classifier/efficientnet_lite2/int8/1/efficientnet_lite2.tflite" general2.tflite
          try "https://storage.googleapis.com/mediapipe-models/image_embedder/mobilenet_v3_small/float32/1/mobilenet_v3_small.tflite" embed.tflite
          try "https://storage.googleapis.com/mediapipe-models/image_embedder/mobilenet_v3_large/float32/1/mobilenet_v3_large.tflite" embed_large.tflite
          for i in 1 2 3 4 5 6; do :; done
          i=0; for u in "https://images.pexels.com/photos/1132047/pexels-photo-1132047.jpeg?auto=compress&w=640" "https://images.pexels.com/photos/1435904/pexels-photo-1435904.jpeg?auto=compress&w=640" "https://images.pexels.com/photos/2286776/pexels-photo-2286776.jpeg?auto=compress&w=640" "https://images.pexels.com/photos/1640777/pexels-photo-1640777.jpeg?auto=compress&w=640" "https://images.pexels.com/photos/70746/strawberries-red-fruit-royalty-free-70746.jpeg?auto=compress&w=640" "https://images.pexels.com/photos/2862154/pexels-photo-2862154.jpeg?auto=compress&w=640"; do i=$((i+1)); curl -sL -A "Mozilla/5.0" -o t$i.jpg "$u"; file t$i.jpg >> log.txt; done
          ls -la >> log.txt
          git init -q -b ci-model && git add -A && git -c user.name=ci -c user.email=ci@x commit -qm model && git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-model
