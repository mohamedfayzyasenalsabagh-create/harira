<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>حريره · لوحة الإدارة</title>
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Reem+Kufi:wght@600;700&display=swap" media="print" onload="this.media='all'">
<style>
/* لوحة الإدارة: ترويسة وأرقام اليوم بالأعلى، أربع تبويبات (الطلبات، المشتركين، تفعيل، السجل)، وشريط تبويب ثابت تحت */
:root{
  --bg:#F4F5EF;--card:#FFFFFF;--ink:#1E2A20;--muted:#667063;--line:#E1E4D8;--herb:#2F5D3A;--herb-soft:#E3EDDF;
  --tomato:#C9432A;--tomato-soft:#F8E1DA;--saffron:#D99A1E;--saffron-soft:#FBF0D9;--water:#3B82B6;
  --display:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;--body:"IBM Plex Sans Arabic","Noto Sans Arabic",system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141A15;--card:#1D251E;--ink:#E9EEE6;--muted:#9DA899;--line:#2C362D;--herb:#7FB98A;--herb-soft:#24362A;--tomato:#F07A5E;--tomato-soft:#3A2420;--saffron:#E8B34A;--saffron-soft:#3A3020;--water:#6FB1E0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141A15;--card:#1D251E;--ink:#E9EEE6;--muted:#9DA899;--line:#2C362D;--herb:#7FB98A;--herb-soft:#24362A;--tomato:#F07A5E;--tomato-soft:#3A2420;--saffron:#E8B34A;--saffron-soft:#3A3020;--water:#6FB1E0;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--body);-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
main{max-width:720px;margin:0 auto;padding-block:calc(14px + env(safe-area-inset-top,0px)) 110px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:24px;color:var(--herb)}h2{font-size:17px}
.muted{color:var(--muted)}small{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.btn{border:0;border-radius:12px;padding:10px 14px;background:var(--herb);color:var(--card);font-weight:700;cursor:pointer;white-space:nowrap}
.btn.ghost{background:var(--herb-soft);color:var(--herb)}.btn.red{background:var(--tomato);color:#fff}.btn.soft-red{background:var(--tomato-soft);color:var(--tomato)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5}
.btn:focus-visible,.tab:focus-visible,.seg button:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
input{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
input:focus{outline:2px solid var(--herb);border-color:transparent}
code{font-family:ui-monospace,monospace;direction:ltr;unicode-bidi:embed;font-size:12px;background:var(--bg);padding:1px 6px;border-radius:6px}
a{color:var(--herb)}
/* الترويسة */
.top{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:14px;flex:none}
.top .t{flex:1;min-width:0}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--herb)}
.dot.busy{background:var(--saffron);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.dot.busy{animation:none}}
.icon-btn{border:0;background:var(--herb-soft);color:var(--herb);width:40px;height:40px;border-radius:12px;font-size:18px;cursor:pointer;display:grid;place-items:center;flex:none;text-decoration:none}
/* الأرقام */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:560px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden}
.kpi small{color:var(--muted)}
.kpi b{font-family:var(--display);font-size:28px;line-height:1.15}
.kpi i{font-style:normal;font-size:12px;color:var(--muted)}
.kpi::before{content:"";position:absolute;inset-inline-start:0;top:12px;bottom:12px;width:4px;border-radius:4px;background:var(--k,var(--herb))}
.kpi.warn{--k:var(--saffron)}.kpi.alert{--k:var(--tomato)}.kpi.info{--k:var(--water)}
/* أدوات القوائم */
.seg{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;overflow-x:auto;scrollbar-width:none}
.seg button{border:0;background:none;border-radius:9px;padding:7px 12px;cursor:pointer;white-space:nowrap;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--herb);color:var(--card);font-weight:700}
.count{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--tomato);color:#fff;font-size:11px;text-align:center;margin-inline-start:4px}
.search{position:relative}.search input{padding-inline-start:38px}.search span{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
/* الطلبات */
.req{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:start}
.req img{width:96px;height:120px;object-fit:cover;border-radius:12px;background:var(--bg);cursor:zoom-in;border:1px solid var(--line)}
.req .noimg{width:96px;height:120px;border-radius:12px;background:var(--bg);display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center}
.req .meta{display:flex;flex-direction:column;gap:3px;min-width:0}
.req .meta b{font-size:16px}
.req .actions{grid-column:1/-1;display:flex;flex-direction:column;gap:8px}
.plan-pick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.plan-pick button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0;font-size:13px}
.plan-pick button b{font-size:15px}
.plan-pick button[aria-pressed="true"]{border-color:var(--herb);background:var(--herb-soft);color:var(--herb)}
@media (max-width:420px){.req{grid-template-columns:1fr}.req img,.req .noimg{width:100%;height:200px;object-fit:contain}}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.p-new{background:var(--saffron-soft);color:var(--saffron)}.p-ok{background:var(--herb-soft);color:var(--herb)}.p-no{background:var(--tomato-soft);color:var(--tomato)}.p-life{background:var(--herb);color:var(--card)}
/* المشتركين */
.sub{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.sub:first-child{border-top:0}
.av{width:44px;height:44px;border-radius:50%;background:var(--herb-soft);color:var(--herb);display:grid;place-items:center;font-weight:700;font-family:var(--display)}
.sub .t{min-width:0}.sub .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.days{height:5px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:4px}.days i{display:block;height:100%;background:var(--herb)}
.days.low i{background:var(--saffron)}
.empty{text-align:center;padding:28px 10px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.log{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}.log:first-child{border-top:0}
.log span:first-child{font-size:18px}
/* شريط التبويب */
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tab{border:0;background:none;padding:7px 2px;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);position:relative}
.tab span{font-size:20px;line-height:1}
.tab[aria-selected="true"]{color:var(--herb);background:var(--herb-soft);font-weight:700}
.tab .count{position:absolute;top:2px;inset-inline-end:18%}
/* نوافذ */
.sheet-bg{position:fixed;inset:0;background:rgb(0 0 0 / .5);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:22px 22px 0 0;max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:12px;
  padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lightbox{position:fixed;inset:0;z-index:40;background:rgb(0 0 0 / .9);display:grid;place-items:center;padding:16px}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:50;font-size:14px}
</style>
</head>
<body>
<main id="m"><p class="muted">عم حمّل…</p></main>
<nav class="tabs" id="nav" hidden>
  <button class="tab" data-v="reqs"><span>📥</span>الطلبات</button>
  <button class="tab" data-v="subs"><span>👥</span>المشتركين</button>
  <button class="tab" data-v="grant"><span>✨</span>تفعيل</button>
  <button class="tab" data-v="log"><span>🕘</span>السجل</button>
</nav>
<script src="sub.js"></script>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const DAY = 864e5, PLANS = { m1: ["شهر", 30], m3: ["٣ أشهر", 90], y1: ["سنة", 365], life: ["مدى الحياة", 0] };
const fmtN = n => Math.round(n).toLocaleString("ar-SY");
const fmtDate = t => t === 0 ? "مدى الحياة" : new Date(t).toLocaleDateString("ar-SY", { day: "numeric", month: "short", year: "numeric" });
const ago = t => { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? "هلق" : m < 60 ? "من " + fmtN(m) + " د" : m < 1440 ? "من " + fmtN(m / 60) + " س" : "من " + fmtN(m / 1440) + " يوم"; };
const toast = m => { document.querySelectorAll(".toast").forEach(x => x.remove()); const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.append(t); setTimeout(() => t.remove(), 2600); };
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } };
const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { toast("ذاكرة الموبايل امتلت، امسح السجل القديم"); } };
const waLink = p => "https://wa.me/" + (String(p).replace(/\D/g, "").replace(/^0/, "963"));

(function setup() { const m = location.hash.match(/k=([\w-]+)\.([\w-]+)/); if (m) { store("harira-admin", { sign: m[1], dh: m[2] }); history.replaceState(null, "", location.pathname); } })();
const KEYS = load("harira-admin", null);
let REQS = load("harira-admin-reqs", {});   // طلبات مفكوكة
let SUBS = load("harira-admin-subs", {});   // معلومات المشتركين (الاسم والرقم)
let LOG = load("harira-admin-log", []);     // سجل العمليات
let DURABLE = {};                           // من subs.json: آخر تفعيل موقّع لكل حساب
let view = "reqs", filter = "active", q = "", syncing = false, lastSync = 0;
const pickPlan = {};

function addLog(icon, text) { LOG.unshift({ icon, text, t: Date.now() }); LOG = LOG.slice(0, 200); store("harira-admin-log", LOG); }
async function priv(kind) {
  const pub = kind === "sign" ? SUB.signPub : SUB.dhPub;
  const alg = kind === "sign" ? { name: "ECDSA", namedCurve: "P-256" } : { name: "ECDH", namedCurve: "P-256" };
  return crypto.subtle.importKey("jwk", { kty: "EC", crv: "P-256", ...pub, d: KEYS[kind], ext: true }, alg, false, kind === "sign" ? ["sign"] : ["deriveKey"]);
}
async function decrypt(txt) {
  const o = JSON.parse(txt);
  const epk = await crypto.subtle.importKey("jwk", { kty: "EC", crv: "P-256", ...o.epk, ext: true }, { name: "ECDH", namedCurve: "P-256" }, false, []);
  const key = await crypto.subtle.deriveKey({ name: "ECDH", public: epk }, await priv("dh"), { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64u(o.iv) }, key, unb64u(o.ct))));
}
async function sign(obj) { const p = b64u(utf8(JSON.stringify(obj))); return p + "." + b64u(await crypto.subtle.sign({ name: "ECDSA", hash: "SHA-256" }, await priv("sign"), utf8(p))); }
async function sendToken(id, token) {
  const r = await fetch(SUB.ntfy + SUB.actPrefix + id, { method: "POST", body: token });
  if (!r.ok) throw new Error("ما انبعت");
  fetch(SUB.ntfy + SUB.actsTopic, { method: "POST", body: token }).catch(() => {});
}
const decodeTok = t => { try { return JSON.parse(new TextDecoder().decode(unb64u(t.split(".")[0]))); } catch (e) { return null; } };

// قائمة المشتركين الموحّدة: السجل الدائم (من أي موبايل أدمن) + اللي على هالموبايل
function subscribers() {
  const out = {};
  for (const [id, tok] of Object.entries(DURABLE)) { const d = decodeTok(tok); if (d && d.t === "ok") out[id] = { exp: d.exp, plan: d.plan, at: d.iat }; }
  for (const [id, s] of Object.entries(SUBS)) out[id] = { ...(out[id] || {}), ...s, ...(out[id] && out[id].at > (s.at || 0) ? { exp: out[id].exp, plan: out[id].plan, at: out[id].at } : {}) };
  for (const r of Object.values(REQS)) if (out[r.id]) out[r.id] = { name: r.name, phone: r.phone, email: r.email, ...out[r.id] };
  return out;
}
const isActive = s => s.exp === 0 || s.exp > Date.now();

async function sync(manual) {
  if (syncing) return; syncing = true; render();
  let added = 0;
  try {
    const lines = (await (await fetch(SUB.ntfy + SUB.reqTopic + "/json?poll=1&since=all")).text()).split("\n").filter(Boolean);
    for (const l of lines) {
      let m; try { m = JSON.parse(l); } catch (e) { continue; }
      if (m.event !== "message" || REQS[m.id]) continue;
      try {
        const d = await decrypt(m.attachment ? await (await fetch(m.attachment.url)).text() : m.message);
        if (d.t !== "req" || !d.id) continue;
        for (const [k, v] of Object.entries(REQS)) if (v.id === d.id && v.status === "new") delete REQS[k];
        REQS[m.id] = { ...d, status: "new", got: Date.now() }; added++;
      } catch (e) {}
    }
    if (added) { store("harira-admin-reqs", REQS); toast("📥 وصل " + fmtN(added) + " طلب جديد"); addLog("📥", "وصل " + fmtN(added) + " طلب جديد"); }
    else if (manual) toast("ما في طلبات جديدة");
  } catch (e) { if (manual) toast("ما في اتصال، عم اعرض المحفوظ"); }
  try { DURABLE = await (await fetch("subs.json", { cache: "no-cache" })).json(); } catch (e) {}
  syncing = false; lastSync = Date.now(); render();
}

async function decide(rid, plan, why) {
  const r = REQS[rid]; if (!r) return;
  try {
    let tok;
    if (plan === "rej") { tok = await sign({ t: "rej", id: r.id, iat: Date.now(), why: why || "" }); r.status = "rej"; r.why = why || ""; addLog("❌", "رفض طلب " + r.name + (why ? " · " + why : "")); }
    else {
      const cur = subscribers()[r.id], base = cur && cur.exp > Date.now() ? cur.exp : Date.now();
      const exp = plan === "life" ? 0 : base + PLANS[plan][1] * DAY;
      tok = await sign({ t: "ok", id: r.id, exp, plan, iat: Date.now() });
      SUBS[r.id] = { name: r.name, phone: r.phone, email: r.email, exp, plan, at: Date.now() };
      r.status = "ok"; r.exp = exp; addLog("✅", "تفعيل " + r.name + " · " + PLANS[plan][0]);
    }
    await sendToken(r.id, tok);
    r.decided = Date.now(); delete r.receipt;
    store("harira-admin-reqs", REQS); store("harira-admin-subs", SUBS);
    toast(plan === "rej" ? "انرفض الطلب وتبلّغ المستخدم" : "✅ تفعّل، بيوصله خلال ثواني");
  } catch (e) { toast("ما قدرت ابعت. تأكد من النت وجرب كمان مرة"); }
  render();
}
async function grant(idRaw, plan, label) {
  const id = String(idRaw).toLowerCase().replace(/[^0-9a-f]/g, "");
  if (id.length < 12) return toast("كود الحساب ناقص أو غلط");
  const cur = subscribers()[id], base = cur && cur.exp > Date.now() ? cur.exp : Date.now();
  const exp = plan === "stop" ? Date.now() - 1000 : plan === "life" ? 0 : base + PLANS[plan][1] * DAY;
  try {
    const tok = await sign({ t: "ok", id, exp, plan, iat: Date.now() });
    await sendToken(id, tok);
    SUBS[id] = { ...(SUBS[id] || {}), exp, plan, at: Date.now() };
    store("harira-admin-subs", SUBS);
    const name = (SUBS[id] && SUBS[id].name) || label || shortCode(id);
    addLog(plan === "stop" ? "⛔" : "✨", (plan === "stop" ? "إيقاف " : "تفعيل ") + name + (plan === "stop" ? "" : " · " + PLANS[plan][0]));
    toast(plan === "stop" ? "⛔ توقف الاشتراك" : "✨ تم، بيوصله خلال ثواني"); render();
  } catch (e) { toast("ما قدرت ابعت. تأكد من النت وجرب كمان مرة"); }
}

function sheet(html, bind) {
  const bg = document.createElement("div"); bg.className = "sheet-bg";
  bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  bg.onclick = e => { if (e.target === bg) bg.remove(); };
  document.body.append(bg); bind($(".sheet", bg), () => bg.remove());
}
function lightbox(src) { const b = document.createElement("div"); b.className = "lightbox"; b.innerHTML = `<img src="${src}" alt="الإيصال">`; b.onclick = () => b.remove(); document.body.append(b); }
function confirmSheet(title, body, okText, danger, onOk) {
  sheet(`<h2>${title}</h2><p class="muted" style="margin:0">${body}</p><div class="row"><button class="btn ${danger ? "red" : ""}" id="ok" style="flex:1">${okText}</button><button class="btn ghost" id="no">إلغاء</button></div>`,
    (el, close) => { $("#ok", el).onclick = () => { close(); onOk(); }; $("#no", el).onclick = close; });
}

function render() {
  const m = $("#m"), nav = $("#nav");
  if (!KEYS) {
    nav.hidden = true;
    m.innerHTML = `<div class="card" style="align-items:center;text-align:center;margin-top:20vh"><img class="logo" src="icon-192.png" alt="" style="width:72px;height:72px;border-radius:20px">
      <h2>لوحة إدارة حريره</h2><p class="muted" style="margin:0">لازم تسجل دخول بإيميل وكلمة سر الأدمن من التطبيق.</p><a class="btn" href="./" style="text-decoration:none">فتح التطبيق</a></div>`; return;
  }
  nav.hidden = false;
  const subs = subscribers(), list = Object.entries(subs), now = Date.now();
  const pend = Object.entries(REQS).filter(([, r]) => r.status === "new").sort((a, b) => a[1].ts - b[1].ts);
  const active = list.filter(([, s]) => isActive(s)), lifetime = active.filter(([, s]) => s.exp === 0);
  const expSoon = active.filter(([, s]) => s.exp && s.exp - now < 7 * DAY);
  const paying = active.length - lifetime.length, price = +(SUB.config.price || 500);
  document.querySelectorAll(".tab").forEach(t => { t.setAttribute("aria-selected", t.dataset.v === view); const c = t.querySelector(".count"); if (c) c.remove(); if (t.dataset.v === "reqs" && pend.length) t.insertAdjacentHTML("beforeend", `<span class="count num">${fmtN(pend.length)}</span>`); });

  let body = "";
  if (view === "reqs") {
    body = pend.length ? pend.map(([rid, r]) => { const pp = pickPlan[rid] || "m1"; return `<div class="card req">
      ${r.receipt ? `<img src="${r.receipt}" alt="الإيصال" data-img="${rid}">` : `<div class="noimg">ما في صورة</div>`}
      <div class="meta"><div class="row between"><b>${esc(r.name)}</b><span class="pill p-new">⏳ ${ago(r.ts)}</span></div>
        ${r.email ? `<small class="muted" dir="ltr" style="text-align:end">${esc(r.email)}</small>` : ""}
        <small><a href="${waLink(r.phone)}" target="_blank" rel="noopener" dir="ltr">📞 ${esc(r.phone)}</a></small>
        <small class="muted">كود <code>${esc(shortCode(r.id))}</code>${subs[r.id] && isActive(subs[r.id]) ? ` · <span class="pill p-ok">مشترك لحد ${fmtDate(subs[r.id].exp)}</span>` : ""}</small></div>
      <div class="actions"><div class="plan-pick">${Object.entries(PLANS).map(([k, [l, d]]) => `<button data-pick="${rid}|${k}" aria-pressed="${pp === k}"><b>${l}</b>${d ? `<small class="muted num">${fmtN(price * d / 30)} ل.س</small>` : `<small class="muted">مجاني</small>`}</button>`).join("")}</div>
        <div class="row"><button class="btn" data-ok="${rid}" style="flex:1">✓ موافقة · ${PLANS[pp][0]}</button><button class="btn soft-red" data-rej="${rid}">رفض</button></div></div></div>`; }).join("")
      : `<div class="card empty"><span style="font-size:40px">🎉</span><b>ما في طلبات معلّقة</b>كل ما حدا يبعت إيصال بيطلع هون، وبتتحدّث الصفحة لحالها كل ٣٠ ثانية.</div>`;
    const done = Object.entries(REQS).filter(([, r]) => r.status !== "new").sort((a, b) => (b[1].decided || 0) - (a[1].decided || 0)).slice(0, 5);
    if (done.length) body += `<div class="card"><h2>آخر القرارات</h2>${done.map(([, r]) => `<div class="row between" style="border-top:1px solid var(--line);padding-top:8px"><span>${esc(r.name)}</span><span class="pill ${r.status === "ok" ? "p-ok" : "p-no"}">${r.status === "ok" ? "✓ " + fmtDate(r.exp) : "✕ مرفوض"}</span></div>`).join("")}</div>`;
  }
  if (view === "subs") {
    const f = { active: ([, s]) => isActive(s), soon: ([, s]) => isActive(s) && s.exp && s.exp - now < 7 * DAY, life: ([, s]) => s.exp === 0, ended: ([, s]) => !isActive(s), all: () => true }[filter];
    const ql = q.trim().toLowerCase();
    const rows = list.filter(f).filter(([id, s]) => !ql || [s.name, s.email, s.phone, id].some(x => String(x || "").toLowerCase().includes(ql)))
      .sort((a, b) => (a[1].exp === 0 ? 1e15 : a[1].exp) - (b[1].exp === 0 ? 1e15 : b[1].exp));
    body = `<div class="search"><span>🔍</span><input id="q" type="search" placeholder="دوّر بالاسم أو الرقم أو الإيميل" value="${esc(q)}"></div>
      <div class="seg">${[["active", "فعّال", active.length], ["soon", "بينتهي قريباً", expSoon.length], ["life", "مدى الحياة", lifetime.length], ["ended", "منتهي", list.length - active.length], ["all", "الكل", list.length]].map(([k, l, n]) => `<button data-f="${k}" aria-pressed="${filter === k}">${l} <span class="num">${fmtN(n)}</span></button>`).join("")}</div>
      <div class="card">${rows.length ? rows.map(([id, s]) => { const left = s.exp ? Math.ceil((s.exp - now) / DAY) : null; return `<div class="sub" data-sub="${id}">
        <div class="av">${esc((s.name || "؟").trim().charAt(0))}</div>
        <div class="t"><b>${esc(s.name || "بدون اسم")}</b><small class="muted"><code>${esc(shortCode(id))}</code> ${s.phone ? "· " + esc(s.phone) : ""}</small>
          ${s.exp ? `<div class="days ${left < 7 ? "low" : ""}"><i style="width:${Math.max(0, Math.min(100, left / 30 * 100))}%"></i></div>` : ""}</div>
        <span class="pill ${s.exp === 0 ? "p-life" : left > 7 ? "p-ok" : left > 0 ? "p-new" : "p-no"}">${s.exp === 0 ? "∞ مدى الحياة" : left > 0 ? "باقي " + fmtN(left) + " يوم" : "منتهي"}</span></div>`; }).join("")
        : `<div class="empty"><b>ما في نتائج</b>${list.length ? "جرّب فلتر تاني." : "أول ما توافق على طلب بيطلع المشترك هون."}</div>`}</div>`;
  }
  if (view === "grant") {
    body = `<div class="card"><h2>تفعيل أو تمديد يدوي</h2><small class="muted">المستخدم بيلاقي كود حسابه بالتطبيق: فوق على زر الاشتراك ← "كود حسابك". مفيد إذا دفع بطريقة تانية، أو بدك تهديه اشتراك.</small>
      <input id="gid" placeholder="كود الحساب" dir="ltr"><input id="gname" placeholder="الاسم (اختياري)">
      <div class="plan-pick">${Object.entries(PLANS).map(([k, [l]]) => `<button data-g="${k}"><b>${l}</b></button>`).join("")}</div>
      <button class="btn soft-red" data-g="stop">⛔ إيقاف اشتراك هالحساب</button></div>
      <div class="card"><h2>شلون بيمشي الشغل</h2><ol style="margin:0;padding-inline-start:20px;line-height:2" class="muted">
        <li>المستخدم بيدفع ${fmtN(price)} ل.س بشام كاش وبيرفع الإيصال.</li><li>بيوصلك هون مشفّر، وبتتأكد من الإيصال بعينك.</li><li>بتوافق، والتطبيق عنده بيتفعّل خلال ثواني، ومن أي موبايل بيسجل منه.</li></ol></div>`;
  }
  if (view === "log") {
    body = `<div class="card">${LOG.length ? LOG.slice(0, 60).map(l => `<div class="log"><span>${l.icon}</span><span style="flex:1">${esc(l.text)}</span><small class="muted">${ago(l.t)}</small></div>`).join("") : `<div class="empty"><b>السجل فاضي</b>كل موافقة أو رفض أو تفعيل بيتسجل هون.</div>`}</div>`;
  }

  m.innerHTML = `<div class="top"><img class="logo" src="icon-192.png" alt=""><div class="t"><h1>لوحة الإدارة</h1>
      <div class="sync"><i class="dot ${syncing ? "busy" : ""}"></i>${syncing ? "عم حدّث…" : lastSync ? "آخر تحديث " + ago(lastSync) : ""}</div></div>
    <button class="icon-btn" id="refresh" aria-label="تحديث">⟳</button><a class="icon-btn" href="./" aria-label="رجوع للتطبيق">↩</a></div>
  <div class="kpis">
    <div class="kpi ${pend.length ? "alert" : ""}"><small>طلبات بانتظارك</small><b class="num">${fmtN(pend.length)}</b></div>
    <div class="kpi"><small>مشتركين فعّالين</small><b class="num">${fmtN(active.length)}</b><i>${fmtN(lifetime.length)} مدى الحياة</i></div>
    <div class="kpi warn"><small>بينتهوا خلال أسبوع</small><b class="num">${fmtN(expSoon.length)}</b></div>
    <div class="kpi info"><small>دخل شهري متوقّع</small><b class="num">${fmtN(paying * price)}</b><i>ل.س</i></div>
  </div>
  ${body}`;

  $("#refresh").onclick = () => sync(true);
  m.querySelectorAll("[data-img]").forEach(i => i.onclick = () => lightbox(i.src));
  m.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => { const [rid, p] = b.dataset.pick.split("|"); pickPlan[rid] = p; render(); });
  m.querySelectorAll("[data-ok]").forEach(b => b.onclick = () => { const rid = b.dataset.ok, r = REQS[rid], p = pickPlan[rid] || "m1";
    confirmSheet("تفعيل " + esc(r.name), `تأكدت إنو المبلغ وصل لمحفظتك؟ رح يتفعّل ${PLANS[p][0]}${p === "life" ? " مجاناً" : ""}.`, "✓ فعّل", false, () => decide(rid, p)); });
  m.querySelectorAll("[data-rej]").forEach(b => b.onclick = () => { const rid = b.dataset.rej, r = REQS[rid];
    sheet(`<h2>رفض طلب ${esc(r.name)}</h2><p class="muted" style="margin:0">السبب بيطلع للمستخدم ليصحح الطلب:</p>
      <div class="row">${["الإيصال مو واضح", "المبلغ ناقص", "ما وصل المبلغ", "إيصال قديم"].map(x => `<button class="btn ghost sm" data-why="${x}">${x}</button>`).join("")}</div>
      <input id="why" placeholder="أو اكتب سبب"><div class="row"><button class="btn red" id="go" style="flex:1">رفض</button><button class="btn ghost" id="no">إلغاء</button></div>`, (el, close) => {
      el.querySelectorAll("[data-why]").forEach(x => x.onclick = () => $("#why", el).value = x.dataset.why);
      $("#go", el).onclick = () => { close(); decide(rid, "rej", $("#why", el).value.trim()); }; $("#no", el).onclick = close; }); });
  m.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { filter = b.dataset.f; render(); });
  const qi = $("#q"); if (qi) qi.oninput = () => { q = qi.value; const pos = qi.selectionStart; render(); const n = $("#q"); n.focus(); n.setSelectionRange(pos, pos); };
  m.querySelectorAll("[data-sub]").forEach(row => row.onclick = () => { const id = row.dataset.sub, s = subscribers()[id];
    sheet(`<div class="row" style="gap:12px"><div class="av" style="width:56px;height:56px;font-size:22px">${esc((s.name || "؟").charAt(0))}</div><div><h2>${esc(s.name || "بدون اسم")}</h2><small class="muted">${s.exp === 0 ? "مدى الحياة" : isActive(s) ? "مشترك لحد " + fmtDate(s.exp) : "منتهي من " + fmtDate(s.exp)}</small></div></div>
      ${s.email ? `<div class="row between"><span class="muted">الإيميل</span><span dir="ltr">${esc(s.email)}</span></div>` : ""}
      ${s.phone ? `<div class="row between"><span class="muted">الرقم</span><a href="${waLink(s.phone)}" target="_blank" rel="noopener" dir="ltr">💬 ${esc(s.phone)}</a></div>` : ""}
      <div class="row between"><span class="muted">كود الحساب</span><code>${esc(id)}</code></div>
      <b>تمديد</b><div class="plan-pick">${Object.entries(PLANS).map(([k, [l]]) => `<button data-x="${k}"><b>+ ${l}</b></button>`).join("")}</div>
      <button class="btn soft-red" data-x="stop">⛔ إيقاف الاشتراك</button>`, (el, close) => {
      el.querySelectorAll("[data-x]").forEach(b => b.onclick = () => { const p = b.dataset.x;
        if (p === "stop") { close(); confirmSheet("إيقاف " + esc(s.name || ""), "التطبيق عنده رح يتقفل لحد ما تفعّله من جديد.", "⛔ أوقف", true, () => grant(id, "stop")); }
        else { close(); grant(id, p); } }); }); });
  m.querySelectorAll("[data-g]").forEach(b => b.onclick = () => { const id = $("#gid").value, nm = $("#gname").value.trim(), p = b.dataset.g;
    if (nm) { const cid = String(id).toLowerCase().replace(/[^0-9a-f]/g, ""); SUBS[cid] = { ...(SUBS[cid] || {}), name: nm }; }
    if (p === "stop") confirmSheet("إيقاف الاشتراك", "متأكد بدك توقف اشتراك هالحساب؟", "⛔ أوقف", true, () => grant(id, p, nm)); else grant(id, p, nm); });
}
document.querySelectorAll(".tab").forEach(t => t.onclick = () => { view = t.dataset.v; render(); scrollTo(0, 0); });
render();
if (KEYS) { sync(); setInterval(() => { if (!document.querySelector(".sheet-bg") && !(document.activeElement && document.activeElement.tagName === "INPUT")) sync(); }, 30000); }
</script>
</body>
</html>
