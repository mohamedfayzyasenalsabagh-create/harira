<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>حريره · الإدارة</title>
<link rel="icon" href="icon-192.png">
<style>
/* لوحة إدارة الاشتراكات: قائمة طلبات بالأعلى، والمشتركين تحت */
:root{--bg:#F4F5EF;--card:#fff;--ink:#1E2A20;--muted:#667063;--line:#E1E4D8;--herb:#2F5D3A;--herb-soft:#E3EDDF;--tomato:#C9432A;--saffron:#D99A1E;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141A15;--card:#1D251E;--ink:#E9EEE6;--muted:#9DA899;--line:#2C362D;--herb:#7FB98A;--herb-soft:#24362A;--tomato:#F07A5E;--saffron:#E8B34A;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "IBM Plex Sans Arabic","Noto Sans Arabic",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
h1{margin:0;color:var(--herb);font-size:24px}h2{margin:0;font-size:17px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.muted{color:var(--muted)}small{font-size:13px}
.btn{border:0;border-radius:12px;padding:10px 14px;background:var(--herb);color:var(--card);font:inherit;font-weight:700;cursor:pointer}
.btn.ghost{background:var(--herb-soft);color:var(--herb)}.btn.red{background:var(--tomato);color:#fff}
.btn:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
input{font:inherit;color:inherit;width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
img.rc{width:100%;max-height:420px;object-fit:contain;border-radius:12px;background:var(--bg);cursor:zoom-in}
.pill{border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.p-new{background:var(--saffron);color:#1E2A20}.p-ok{background:var(--herb-soft);color:var(--herb)}.p-no{background:var(--tomato);color:#fff}
code{font-family:ui-monospace,monospace;direction:ltr;unicode-bidi:embed;word-break:break-all}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px}
</style>
</head>
<body>
<main id="m"><h1>حريره · الإدارة</h1><p class="muted">عم حمّل…</p></main>
<script src="sub.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const day = 864e5;
const fmtDate = t => t === 0 ? "مدى الحياة" : new Date(t).toLocaleDateString("ar-SY", { day: "numeric", month: "long", year: "numeric" });
const toast = m => { document.querySelectorAll(".toast").forEach(x => x.remove()); const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.append(t); setTimeout(() => t.remove(), 2500); };
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } };
const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { toast("الذاكرة امتلت، احذف طلبات قديمة"); } };

// مفاتيح الإدارة: بتجي مرة وحدة من رابط الإعداد وبتنحفظ على هالموبايل بس
(function setup() {
  const m = location.hash.match(/k=([\w-]+)\.([\w-]+)/);
  if (m) { store("harira-admin", { sign: m[1], dh: m[2] }); history.replaceState(null, "", location.pathname); }
})();
const KEYS = load("harira-admin", null);
let REQS = load("harira-admin-reqs", {});   // id الرسالة ← طلب مفكوك
let SUBS = load("harira-admin-subs", {});   // كود الجهاز ← { name, phone, exp }

async function priv(kind) {
  const pub = kind === "sign" ? SUB.signPub : SUB.dhPub;
  const alg = kind === "sign" ? { name: "ECDSA", namedCurve: "P-256" } : { name: "ECDH", namedCurve: "P-256" };
  return crypto.subtle.importKey("jwk", { kty: "EC", crv: "P-256", ...pub, d: KEYS[kind], ext: true }, alg, false, kind === "sign" ? ["sign"] : ["deriveKey"]);
}
async function decrypt(txt) {
  const o = JSON.parse(txt);
  const epk = await crypto.subtle.importKey("jwk", { kty: "EC", crv: "P-256", ...o.epk, ext: true }, { name: "ECDH", namedCurve: "P-256" }, false, []);
  const key = await crypto.subtle.deriveKey({ name: "ECDH", public: epk }, await priv("dh"), { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64u(o.iv) }, key, unb64u(o.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function sign(obj) {
  const p = b64u(utf8(JSON.stringify(obj)));
  const s = await crypto.subtle.sign({ name: "ECDSA", hash: "SHA-256" }, await priv("sign"), utf8(p));
  return p + "." + b64u(s);
}
async function sendToken(id, token) {
  const r = await fetch(SUB.ntfy + SUB.actPrefix + id, { method: "POST", body: token });
  if (!r.ok) throw new Error("ما انبعت");
}

// جلب الطلبات الجديدة
async function fetchReqs() {
  let lines = [];
  try { lines = (await (await fetch(SUB.ntfy + SUB.reqTopic + "/json?poll=1&since=all")).text()).split("\n").filter(Boolean); }
  catch (e) { toast("ما في اتصال، عم اعرض المحفوظ"); return; }
  let added = 0;
  for (const l of lines) {
    let m; try { m = JSON.parse(l); } catch (e) { continue; }
    if (m.event !== "message" || REQS[m.id]) continue;
    try {
      const txt = m.attachment ? await (await fetch(m.attachment.url)).text() : m.message;
      const d = await decrypt(txt);
      if (d.t !== "req" || !d.id) continue;
      // نفس الجهاز بعت مرتين: منخلي الأحدث
      for (const [k, v] of Object.entries(REQS)) if (v.id === d.id && v.status === "new") delete REQS[k];
      REQS[m.id] = { ...d, status: "new", got: Date.now() }; added++;
    } catch (e) { /* رسالة مو إلنا أو منتهية */ }
  }
  if (added) { store("harira-admin-reqs", REQS); toast("وصل " + added + " طلب جديد"); }
  return added;
}

async function decide(rid, plan) {
  const r = REQS[rid]; if (!r) return;
  try {
    let tok;
    if (plan === "rej") {
      tok = await sign({ t: "rej", id: r.id, iat: Date.now(), why: "" });
      r.status = "rej";
    } else {
      const cur = SUBS[r.id] && SUBS[r.id].exp, base = cur && cur > Date.now() ? cur : Date.now();
      const exp = plan === "life" ? 0 : base + ({ m1: 30, m3: 90, y1: 365 }[plan]) * day;
      tok = await sign({ t: "ok", id: r.id, exp, plan, iat: Date.now() });
      SUBS[r.id] = { name: r.name, phone: r.phone, exp, plan, at: Date.now() };
      r.status = "ok"; r.exp = exp;
    }
    await sendToken(r.id, tok);
    r.token = tok; delete r.receipt; // الإيصال ما عاد لازم بعد القرار، منوفر مساحة
    store("harira-admin-reqs", REQS); store("harira-admin-subs", SUBS);
    toast(plan === "rej" ? "انرفض الطلب وتبلّغ المستخدم" : "تفعّل الاشتراك، وبيوصله خلال ثواني");
  } catch (e) { toast("ما قدرت ابعت. جرّب كمان مرة"); }
  render();
}
async function grant(idRaw, plan) {
  const id = String(idRaw).toLowerCase().replace(/[^0-9a-f]/g, "");
  if (id.length < 12) return toast("كود الجهاز ناقص");
  const cur = SUBS[id] && SUBS[id].exp, base = cur && cur > Date.now() ? cur : Date.now();
  const exp = plan === "stop" ? Date.now() - 1000 : plan === "life" ? 0 : base + ({ m1: 30, m3: 90, y1: 365 }[plan]) * day;
  try {
    const tok = await sign({ t: "ok", id, exp, plan, iat: Date.now() });
    await sendToken(id, tok);
    SUBS[id] = { ...(SUBS[id] || {}), exp, plan, at: Date.now(), token: tok };
    store("harira-admin-subs", SUBS); toast(plan === "stop" ? "توقف الاشتراك" : "تم، بيوصله خلال ثواني"); render();
  } catch (e) { toast("ما قدرت ابعت. جرّب كمان مرة"); }
}

function render() {
  const m = $("#m");
  if (!KEYS) { m.innerHTML = `<h1>حريره · الإدارة</h1><div class="card"><b>هالموبايل مو مفعّل كإدارة.</b><p class="muted" style="margin:0">افتح رابط الإعداد الخاص (اللي فيه المفتاح) مرة وحدة على الموبايل اللي بدك تدير منه.</p></div>`; return; }
  const list = Object.entries(REQS).sort((a, b) => (a[1].status === "new" ? 0 : 1) - (b[1].status === "new" ? 0 : 1) || b[1].ts - a[1].ts);
  const pending = list.filter(([, r]) => r.status === "new");
  const subs = Object.entries(SUBS).sort((a, b) => (b[1].at || 0) - (a[1].at || 0));
  const now = Date.now();
  m.innerHTML = `<div class="row between"><h1>حريره · الإدارة</h1><button class="btn ghost" id="refresh">تحديث</button></div>
  <div class="card"><div class="row between"><h2>طلبات الاشتراك</h2><span class="pill ${pending.length ? "p-new" : "p-ok"}">${pending.length} جديد</span></div>
    ${list.length ? list.map(([rid, r]) => `<div class="card" style="gap:8px">
      <div class="row between"><b>${esc(r.name)}</b><span class="pill ${r.status === "new" ? "p-new" : r.status === "ok" ? "p-ok" : "p-no"}">${r.status === "new" ? "بانتظارك" : r.status === "ok" ? "مفعّل · " + fmtDate(r.exp) : "مرفوض"}</span></div>
      <small class="muted">📞 <a href="https://wa.me/${esc(String(r.phone).replace(/\D/g, ""))}" target="_blank" rel="noopener">${esc(r.phone)}</a> · ${new Date(r.ts).toLocaleString("ar-SY")} · كود: <code>${esc(shortCode(r.id))}</code></small>
      ${r.receipt ? `<img class="rc" src="${r.receipt}" alt="صورة الإيصال">` : ""}
      ${r.status === "new" ? `<div class="row"><button class="btn" data-d="${rid}|m1">موافقة شهر</button><button class="btn ghost" data-d="${rid}|m3">٣ أشهر</button><button class="btn ghost" data-d="${rid}|y1">سنة</button><button class="btn ghost" data-d="${rid}|life">مجاني مدى الحياة</button><button class="btn red" data-d="${rid}|rej">رفض</button></div>` : ""}
    </div>`).join("") : `<p class="muted" style="margin:0">ما في طلبات. أول ما حدا يبعت إيصال بيبيّن هون.</p>`}
  </div>
  <div class="card"><h2>تفعيل يدوي</h2><small class="muted">المستخدم بيلاقي كود جهازه بصفحة الاشتراك بالتطبيق.</small>
    <input id="gid" placeholder="كود الجهاز" dir="ltr">
    <div class="row"><button class="btn" data-g="m1">شهر</button><button class="btn ghost" data-g="m3">٣ أشهر</button><button class="btn ghost" data-g="y1">سنة</button><button class="btn ghost" data-g="life">مجاني مدى الحياة</button><button class="btn red" data-g="stop">إيقاف</button></div></div>
  <div class="card"><div class="row between"><h2>المشتركين</h2><span class="muted">${subs.filter(([, s]) => s.exp === 0 || s.exp > now).length} فعّال</span></div>
    ${subs.length ? subs.map(([id, s]) => `<div class="row between" style="border-top:1px solid var(--line);padding-top:8px"><span><b>${esc(s.name || "—")}</b><br><small class="muted"><code>${esc(shortCode(id))}</code> · ${s.exp === 0 ? "مدى الحياة" : s.exp > now ? "لحد " + fmtDate(s.exp) : "منتهي"}</small></span>
      <span class="row"><button class="btn ghost" data-s="${id}|m1">+شهر</button><button class="btn ghost" data-s="${id}|life">مدى الحياة</button><button class="btn red" data-s="${id}|stop">إيقاف</button></span></div>`).join("") : `<p class="muted" style="margin:0">لسا ما في مشتركين.</p>`}
  </div>
  <div class="card"><h2>إشعارات الطلبات على موبايلك</h2>
    <small class="muted">نزّل تطبيق <b>ntfy</b> من المتجر، كبّس + واكتب اسم القناة هاد، وكل ما يجي طلب جديد بيوصلك إشعار. بعدها افتح هالصفحة لتوافق.</small>
    <div class="row"><code id="topic">${SUB.reqTopic}</code><button class="btn ghost" id="copy">نسخ</button></div></div>`;
  $("#refresh").onclick = async () => { toast("عم حدّث…"); await fetchReqs(); render(); };
  $("#copy").onclick = () => { navigator.clipboard.writeText(SUB.reqTopic).then(() => toast("انسخ"), () => toast(SUB.reqTopic)); };
  document.querySelectorAll("[data-d]").forEach(b => b.onclick = () => { const [rid, p] = b.dataset.d.split("|"); b.disabled = true; decide(rid, p); });
  document.querySelectorAll("[data-g]").forEach(b => b.onclick = () => grant($("#gid").value, b.dataset.g));
  document.querySelectorAll("[data-s]").forEach(b => b.onclick = () => { const [id, p] = b.dataset.s.split("|"); grant(id, p); });
  document.querySelectorAll("img.rc").forEach(i => i.onclick = () => window.open(i.src));
}
render();
if (KEYS) { fetchReqs().then(render); setInterval(() => fetchReqs().then(n => { if (n) render(); }), 30000); }
</script>
</body>
</html>
